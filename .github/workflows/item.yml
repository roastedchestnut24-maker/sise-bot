name: 품목 원자료 모으기

on:
  workflow_dispatch:
    inputs:
      item:
        description: "품목 이름 (예: 매실)"
        default: "매실"
      start:
        description: "시작일"
        default: "2026-05-01"
      end:
        description: "종료일"
        default: "2026-07-31"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 원자료 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m sise.item_fetch "${{ inputs.item }}" "${{ inputs.start }}" "${{ inputs.end }}"
      - name: 저장
        run: |
          git config user.name "sise-bot"
          git config user.email "sise-bot@users.noreply.github.com"
          git add data/items
          git commit -m "${{ inputs.item }} 원자료 ${{ inputs.start }}~${{ inputs.end }}" || echo "바뀐 내용 없음"
          git pull --rebase
          git push
